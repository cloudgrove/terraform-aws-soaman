name: &service_name gateway-service
port: &port 80
vpc: master
subnet_group: main
cluster: main
config:
  default:
    desired_count: 1
    task_definition:
      name: *service_name
      image: nginx
      cpu: 512
      memory: 1024
      portMappings:
        - containerPort: *port
          hostPort: *port
    variables:
      SERVICE_NAME: *service_name
      PORT: *port
    resources:
      sqs:
        low:
          delay_seconds: 3
        medium:
        high:
          fifo_queue: true
  beta:
    desired_count: 2
    task_definition:
      image: nginx
  prod:
    desired_count: 0
    task_definition:
      image: nginx
