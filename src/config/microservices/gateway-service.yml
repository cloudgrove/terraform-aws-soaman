name: &service_name gateway-service
port: &port 80
vpc: master
subnet_group: main
cluster: main
config:
  default:
    desired_count: 1
    task_definition:
      name: *service_name
      image: nginx
      cpu: 512
      memory: 1024
      portMappings:
        - containerPort: *port
          hostPort: *port
    variables:
      SERVICE_NAME: *service_name
      PORT: *port
      AWS_S3_BUCKET_FOR_DOCUMENTS: cloudgrove.${env}.archives
      AWS_S3_BUCKET_FOR_PUBLIC_CONTENT: &pc_bucket cloudgrove.${env}.public-assets
    resources:
      sqs:
        low:
          delay_seconds: 3
        medium:
        high:
          fifo_queue: true
      s3:
        read_write:
          - cloudgrove.${env}.archives/gateway-service
          - cloudgrove.${env}.archives/shared
        read_only:
          - *pc_bucket
  beta:
    desired_count: 2
    task_definition:
      image: nginx
  prod:
    desired_count: 0
    task_definition:
      image: nginx
